version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: coverchain-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: coverchain
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d coverchain"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: coverchain-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coverchain-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/coverchain
      REDIS_URL: redis://redis:6379
      STELLAR_NETWORK: testnet
      PORT: 4000
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: coverchain-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

  oracle:
    build:
      context: ./oracle
      dockerfile: Dockerfile
    container_name: coverchain-oracle
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - backend

volumes:
  pgdata:
